<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        body {
            margin: 0px;
            padding: 0;
        }
        .parent {
            width: 50px;
            height: 50px;
            background-color: red;
            top: 1rem;
            left: 1rem;
            position: absolute;
            border: 2px solid rgb(104, 104, 104);
        }
        .child {
            height: 50px;
            width: 50px;
            left: -0.5rem;
            background-color: yellow;
            position: absolute;
            /* left: 0px;
            top: 0; */
            border: 2px solid rgb(100, 100, 100);
        }
        .aunt {
            height: 50px;
            width: 50px;
            left: 100px;
            top: 50px;
            background-color: rgb(131, 194, 36);
            border: 2px solid rgb(110, 108, 108);
            position: relative;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
    <div class="aunt"></div>
</body>
</html>
